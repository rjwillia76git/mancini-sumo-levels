<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SUMO &amp; Mancini Levels</title>
<style>
  :root {
    --bg: #08091a;
    --surface: #0e1128;
    --border: rgba(99,102,241,0.12);
    --border-strong: rgba(99,102,241,0.25);
    --text: #e8eaff;
    --text-dim: #5a6090;
    --green: #34d399;
    --green-mid: #4ade80;
    --green-deep: #16a34a;
    --red: #f87171;
    --header-bg: rgba(255,255,255,0.025);
    --header-border: rgba(255,255,255,0.08);
    --row-border: rgba(90,96,144,0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .wrap {
    width: 100%;
    max-width: 760px;
    padding-top: 24px;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px;
    color: var(--text);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .card-header {
    min-height: 44px;
    padding-top: 6px !important;
    padding-bottom: 6px !important;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--header-bg);
    border-bottom: 2px solid var(--header-border);
    flex-wrap: wrap;
    gap: 8px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .date {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', 'SF Mono', monospace;
  }
  button.copy-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.15s;
  }
  button.copy-btn:hover { color: var(--text); }
  button.copy-btn.copied {
    background: rgba(52,211,153,0.13);
    border-color: rgba(52,211,153,0.33);
    color: var(--green);
  }
  button.copy-btn:disabled { cursor: default; opacity: 0.5; }
  .card-body {
    padding: 4px 18px 14px;
  }
  .row {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-top: 1px solid var(--row-border);
    flex-wrap: wrap;
    gap: 4px;
  }
  .row-label {
    width: 90px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .label-text {
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .val-col {
    flex: 1;
    min-width: 140px;
    text-align: right;
    padding-right: 24px;
  }
  .val-col.last { padding-right: 0; }
  .val-prefix {
    font-size: 12px;
    color: var(--text-dim);
    margin-right: 8px;
  }
  .val-num {
    font-size: 18px;
    font-weight: 700;
    font-family: 'DM Mono', 'SF Mono', monospace;
  }
  .basis-note {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 10px;
  }
  .status {
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    padding: 12px 0;
  }
  .status.error { color: var(--red); font-style: normal; }
  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 16px;
  }
  .updated {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', 'SF Mono', monospace;
    margin-top: 4px;
  }
  .hidden { display: none !important; }
  /* Password gate */
  .gate { max-width: 360px; margin: 48px auto 0; padding: 24px; }
  .gate label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .gate-row { display: flex; gap: 8px; }
  .gate input {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border-strong); border-radius: 7px;
    padding: 8px 12px; font-size: 14px; color: var(--text); font-family: inherit; outline: none;
  }
  .gate input:focus-visible, .gate button:focus-visible, button.copy-btn:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
  .gate button {
    background: #818cf8; color: #fff; border: none; border-radius: 7px;
    padding: 8px 18px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .gate-error { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  /* Trade plan levels */
  .plan-card { margin-top: 20px; }
  .plan-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .plan-col { padding: 14px 18px; min-width: 0; }
  .plan-col.right { border-left: 1px solid var(--border); }
  .plan-col.notes-cell { border-top: 1px solid var(--border); }
  .plan-col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .plan-col-title { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 5px 12px; border-radius: 7px; font-size: 14px; font-weight: 600;
    font-family: 'DM Mono', 'SF Mono', monospace; font-variant-numeric: tabular-nums;
  }
  .chip.support { color: var(--green); background: rgba(52,211,153,0.13); border: 1.5px solid rgba(52,211,153,0.4); }
  .chip.resistance { color: var(--red); background: rgba(248,113,113,0.13); border: 1.5px solid rgba(248,113,113,0.4); }
  .notes-title { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
  .notes { display: grid; grid-template-columns: minmax(96px, max-content) 1fr; column-gap: 16px; row-gap: 10px; font-size: 12px; line-height: 1.5; }
  .note-lvl { font-family: 'DM Mono', 'SF Mono', monospace; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .note-text { color: #8890b8; }
  .plan-empty { padding: 16px 18px; font-size: 13px; color: var(--text-dim); font-style: italic; }
  @media (max-width: 480px) {
    .val-col { min-width: 0; padding-right: 12px; }
    .val-num { font-size: 15px; }
    .plan-grid { grid-template-columns: 1fr; }
    .plan-col.right { border-left: none; }
    .plan-col.support-levels { order: 1; }
    .plan-col.support-notes { order: 2; }
    .plan-col.resistance-levels { order: 3; border-top: 1px solid var(--border); }
    .plan-col.resistance-notes { order: 4; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>SUMO &amp; Mancini Levels</h1>
    <form class="card gate hidden" id="gate">
      <label for="pw">Enter password to view</label>
      <div class="gate-row">
        <input type="password" id="pw" autocomplete="current-password" required />
        <button type="submit">Unlock</button>
      </div>
      <div class="gate-error" id="gate-error" role="alert"></div>
    </form>
    <div id="content" class="hidden">
    <div class="card">
      <div class="card-header">
        <span class="card-title">SqueezeMetrics SuMo Levels</span>
        <div class="header-right">
          <span class="date" id="date-label"></span>
          <button class="copy-btn" id="copy-spx" disabled>Copy SPX</button>
          <button class="copy-btn" id="copy-es" disabled>Copy ES</button>
        </div>
      </div>
      <div class="card-body" id="card-body">
        <div class="status" id="status">Loading...</div>
      </div>
    </div>
    <div class="card plan-card">
      <div class="card-header">
        <span class="card-title">Mancini Trade Plan Levels</span>
        <span class="date" id="plan-updated"></span>
      </div>
      <div id="plan-body"><div class="plan-empty">Loading...</div></div>
    </div>
    </div>
  </div>

<script>
const API_URL = "https://xync7f8j0f.execute-api.us-east-1.amazonaws.com/public/sumo-levels";

const ROWS = [
  { key: "trendPlus", label: "MO + 1σ", color: "#ef4444" },
  { key: "momentum",  label: "MO", color: "#22c55e" },
  { key: "midpoint",  label: "MID", color: "#f97316" },
  { key: "support",   label: "SU", color: "#22c55e" },
  { key: "flush",     label: "SU - 0.75σ", color: "#22c55e" },
  { key: "trend",     label: "SU - 1.5σ", color: "#22c55e" },
];

function deriveLevels(spx, esSpread) {
  if (!spx || spx.support == null || spx.midpoint == null || spx.momentum == null) return null;
  const sigma = (spx.midpoint - spx.support) / 0.75;
  const flushSpx = spx.support - 0.75 * sigma;
  const trendSpx = spx.support - 1.50 * sigma;
  const trendPlusSpx = spx.momentum + 1.00 * sigma;
  const withEs = (v) => ({ spx: v, es: esSpread != null ? v + esSpread : null });
  return { sigma, flush: withEs(flushSpx), trend: withEs(trendSpx), trendPlus: withEs(trendPlusSpx) };
}

function fmt(v) { return v != null ? v.toFixed(2) : "—"; }

let lastData = null;

function render(data, errorMsg) {
  const body = document.getElementById("card-body");
  const dateLabel = document.getElementById("date-label");
  const copySpxBtn = document.getElementById("copy-spx");
  const copyEsBtn = document.getElementById("copy-es");

  if (errorMsg) {
    body.innerHTML = '<div class="status error">Failed to load SuMo levels: ' + errorMsg + '</div>';
    return;
  }
  if (!data) {
    body.innerHTML = '<div class="status">Loading...</div>';
    return;
  }

  dateLabel.textContent = data.date || "";
  const derived = deriveLevels(data.spx, data.esSpread);
  const full = {
    momentum: data.spx,
    es: data.es,
  };

  const rowsHtml = ROWS.map(r => {
    let spxVal, esVal;
    if (r.key === "flush" || r.key === "trend" || r.key === "trendPlus") {
      spxVal = derived ? derived[r.key].spx : null;
      esVal = derived ? derived[r.key].es : null;
    } else {
      spxVal = data.spx ? data.spx[r.key] : null;
      esVal = data.es ? data.es[r.key] : null;
    }
    return (
      '<div class="row">' +
        '<div class="row-label"><div class="dot" style="background:' + r.color + '"></div>' +
          '<span class="label-text">' + r.label + '</span></div>' +
        '<div class="val-col"><span class="val-prefix">SPX</span>' +
          '<span class="val-num" style="color:' + r.color + '">' + fmt(spxVal) + '</span></div>' +
        '<div class="val-col last"><span class="val-prefix">ES</span>' +
          '<span class="val-num" style="color:' + r.color + '">' + fmt(esVal) + '</span></div>' +
      '</div>'
    );
  }).join("");

  const basisHtml = data.esSpread != null
    ? '<div class="basis-note">ES = SPX + ' + data.esSpread.toFixed(2) + ' (prior-close ES &minus; SPX basis, frozen for the day)</div>'
    : '<div class="basis-note">ES conversion unavailable — showing SPX only</div>';

  const updated = fmtUpdated(data.fetchedAt);
  body.innerHTML = rowsHtml + basisHtml + (updated ? '<div class="updated">' + updated + '</div>' : '');
  renderPlan(data.mancini);

  lastData = { data, derived };
  copySpxBtn.disabled = !data.spx;
  copyEsBtn.disabled = !data.es;
}

function copyLevels(which) {
  if (!lastData) return;
  const { data, derived } = lastData;
  const levels = data[which];
  if (!levels) return;
  const vals = [
    derived ? derived.trend[which] : null,
    derived ? derived.flush[which] : null,
    levels.support,
    levels.midpoint,
    levels.momentum,
    derived ? derived.trendPlus[which] : null,
  ].map(v => v != null ? v.toFixed(2) : "");
  navigator.clipboard.writeText(vals.join(", ")).then(() => {
    const btn = document.getElementById(which === "spx" ? "copy-spx" : "copy-es");
    const original = btn.textContent;
    btn.textContent = "Copied ✓";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 2000);
  }).catch(() => {});
}

document.getElementById("copy-spx").addEventListener("click", () => copyLevels("spx"));
document.getElementById("copy-es").addEventListener("click", () => copyLevels("es"));

// "Updated 10/1/2026 @ 8:42 PM ET" — always Eastern, regardless of the viewer's timezone.
function fmtUpdated(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const date = d.toLocaleDateString("en-US", { timeZone: "America/New_York", month: "numeric", day: "numeric", year: "numeric" });
  const time = d.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
  return "Updated " + date + " @ " + time + " ET";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const planLevels = { support: [], resistance: [] };

function planCol(side, title, color, entries) {
  const levels = [...new Set(entries.flatMap(e => e.levels))].sort((a, b) => parseFloat(a) - parseFloat(b));
  planLevels[side] = levels;
  const chips = levels.length
    ? levels.map(v => '<span class="chip ' + side + '">' + esc(v) + '</span>').join("")
    : '<span class="plan-empty" style="padding:0">None</span>';
  const notes = entries.filter(e => e.note);
  const notesHtml = notes.length
    ? '<div class="notes">' + notes.map(e =>
        '<span class="note-lvl" style="color:' + color + '">' + esc(e.levels.join(" / ")) +
        '</span><span class="note-text">' + esc(e.note) + '</span>').join("") + '</div>'
    : '<span class="plan-empty" style="padding:0">None</span>';
  const pos = side === "resistance" ? " right" : "";
  return {
    levels: '<div class="plan-col ' + side + '-levels' + pos + '">' +
      '<div class="plan-col-head"><span class="plan-col-title"><span class="dot" style="background:' + color + '"></span>' +
        title + ' <span class="date">(' + levels.length + ')</span></span>' +
        '<button class="copy-btn" data-copy="' + side + '"' + (levels.length ? '' : ' disabled') + '>Copy</button></div>' +
      '<div class="chips">' + chips + '</div></div>',
    notes: '<div class="plan-col notes-cell ' + side + '-notes' + pos + '"><div class="notes-title">' + title + ' Notes</div>' + notesHtml + '</div>',
  };
}

function renderPlan(m) {
  const body = document.getElementById("plan-body");
  document.getElementById("plan-updated").textContent = m ? (fmtUpdated(m.updatedAt) || "") : "";
  if (!m) { body.innerHTML = '<div class="plan-empty">No levels posted yet</div>'; return; }
  const sup = planCol("support", "Support", "#34d399", m.support || []);
  const res = planCol("resistance", "Resistance", "#f87171", m.resistance || []);
  body.innerHTML = '<div class="plan-grid">' + sup.levels + res.levels + sup.notes + res.notes + '</div>';
}

document.getElementById("plan-body").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-copy]");
  if (!btn) return;
  const levels = planLevels[btn.dataset.copy];
  if (!levels.length) return;
  navigator.clipboard.writeText(levels.join(", ")).then(() => {
    btn.textContent = "Copied ✓";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 2000);
  }).catch(() => {});
});

// Password gate. The server checks the password (Authorization: Password <pw>); it's never in
// this page's source. Remembered in localStorage, with an in-memory fallback if storage is blocked.
const PW_KEY = "sumoSitePassword";
let password = null;
try { password = localStorage.getItem(PW_KEY); } catch (e) {}

function showGate(msg) {
  document.getElementById("content").classList.add("hidden");
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("gate-error").textContent = msg || "";
  const input = document.getElementById("pw");
  input.value = "";
  input.focus();
}

document.getElementById("gate").addEventListener("submit", (ev) => {
  ev.preventDefault();
  password = document.getElementById("pw").value;
  fetchLevels();
});

let requestSeq = 0;

async function fetchLevels() {
  if (!password) { showGate(); return; }
  const mine = ++requestSeq;
  try {
    const res = await fetch(API_URL, { headers: { Authorization: "Password " + password } });
    if (mine !== requestSeq) return; // a newer attempt superseded this one; its result wins
    if (res.status === 401) {
      password = null;
      try { localStorage.removeItem(PW_KEY); } catch (e) {}
      showGate("Incorrect password");
      return;
    }
    try { localStorage.setItem(PW_KEY, password); } catch (e) {}
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data, null);
  } catch (e) {
    if (mine !== requestSeq) return;
    document.getElementById("content").classList.remove("hidden");
    render(null, e.message);
    document.getElementById("plan-body").innerHTML = '<div class="plan-empty">Failed to load</div>';
  }
}

fetchLevels();
</script>
</body>
</html>
